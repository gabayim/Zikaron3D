# aaPanel Nginx configuration for go.zmz.ca
# Location: /www/server/panel/vhost/nginx/go.zmz.ca.conf
# Target Web Root: /www/wwwroot/go.zmz.ca

server
{
    listen 80;
    listen 443 ssl http2;
    server_name go.zmz.ca;
    index index.html;
    root /www/wwwroot/go.zmz.ca;

    # SSL configuration (managed via aaPanel Let's Encrypt)
    ssl_certificate    /www/server/panel/vhost/cert/go.zmz.ca/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/go.zmz.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTTP to HTTPS redirect
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # Universal Links: Apple App Site Association (must return application/json with no redirects)
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Referral Landing Route: any /r/<CODE> falls back to index.html
    location ^~ /r/ {
        try_files /index.html =404;
    }

    # Static assets caching
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    access_log  /www/wwwlogs/go.zmz.ca.log;
    error_log   /www/wwwlogs/go.zmz.ca.error.log;
}
